name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical basis
        run: python scripts/validate_canonical_basis.py
      - name: Compile Python entry points
        run: python -m compileall -q scripts goni-lab prototype/01-rag-slice
      - name: Install RAG-slice test dependencies
        run: python -m pip install --requirement prototype/01-rag-slice/requirements-test.txt
      - name: RAG-slice unit tests
        run: python -m pytest -q prototype/01-rag-slice/test_ingest.py
      - name: Benchmark smoke test
        run: python goni-lab/goni_lab.py bench --scenario goni-lab/scenarios/mixed.json
      - name: Text-confinement lint
        run: bash scripts/txt_lint.sh

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/kernel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Cargo format
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --workspace --all-features
      - name: Cargo test
        run: cargo test --workspace --all-features
      - name: Cargo clippy
        run: cargo clippy --workspace --all-features -- -D warnings

  demo-smoke:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Orchestrator smoke test with local LLM stub
        run: bash scripts/run_smoke_local.sh
